apiVersion: v1
kind: Pod
metadata:
  name: devops-002-1
  labels:
    app.kubernetes.io/name: devops-002-1
    my-type: backend
    my-module: module1
    my-project-name: devops-002
spec:
  containers:
    - name: devops-002-1
      image: elifcelik49/devops_002:v001
      resources:
        limits:
          memory: "200Mi"
          cpu: "500m"
      ports:
        - containerPort: 9091
---
apiVersion: v1
kind: Pod
metadata:
  name: devops-002-2
  labels:
    app.kubernetes.io/name: devops-002-2
    my-type: frontend
    my-module: module2
    my-project-name: devops-002
spec:
  containers:
    - name: devops-002-2
      image: mysql:latest
      resources:
        limits:
          memory: "300Mi"
          cpu: "500m"
      ports:
        - containerPort: 9092
---
apiVersion: v1
kind: Pod
metadata:
  name: devops-002-3
  labels:
    app.kubernetes.io/name: devops-002-3
    my-type: mobile
    my-module: module3
    my-project-name: devops-002
spec:
  containers:
    - name: devops-002-3
      image: elifcelik49/devops_002:v001
      resources:
        limits:
          memory: "150Mi"
          cpu: "500m"
      ports:
        - containerPort: 9093